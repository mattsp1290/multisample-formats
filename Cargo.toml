[package]
name = "multisample-formats"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Instrument models and exporters for multisample instruments"
repository = "https://github.com/mattsp1290/multisample-formats"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "docs/**"]

[features]
default = []
serde = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
flate2 = "=1.1.9"

[dev-dependencies]
tempfile = "3"
